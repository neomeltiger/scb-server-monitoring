<svg xmlns="http://www.w3.org/2000/svg">
<!--
  좌측 메뉴 아이콘 (이미지 양식) - 메뉴 이름·순서 화면에서 선택, 값은 "i:<id>" 로 tb_menu.icon 에 저장
  단색 아이콘은 currentColor (메뉴 글자색), 메뉴판(book) 은 색 있음.  목록 : menu.domain.Menu.IMAGE_ICONS
-->
  <!-- 햄버거 (가는 선) -->
  <symbol id="bars" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></g></symbol>
  <!-- 햄버거 (굵은 선) -->
  <symbol id="barsb" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"><path d="M4 5.5h16M4 12h16M4 18.5h16"/></g></symbol>
  <!-- 햄버거 (짧은 선) -->
  <symbol id="barss" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 7h12M6 12h12M6 17h12"/></g></symbol>
  <!-- 바둑판 (테두리) -->
  <symbol id="grid" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></g></symbol>
  <!-- 바둑판 (채움) -->
  <symbol id="gridf" viewBox="0 0 24 24"><g fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2.2"/><rect x="13" y="3" width="8" height="8" rx="2.2"/><rect x="3" y="13" width="8" height="8" rx="2.2"/><rect x="13" y="13" width="8" height="8" rx="2.2"/></g></symbol>
  <!-- 앱 (사각 셋 + 원) -->
  <symbol id="apps" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><circle cx="17.25" cy="17.25" r="3.9"/></g></symbol>
