  <!-- 메뉴북 (주황, 접시 덮개) -->
  <symbol id="book" viewBox="0 0 24 24"><rect x="5" y="2.5" width="15.5" height="19" rx="1" fill="#e98a2b" stroke="#222" stroke-width="1"/><g stroke="#222" stroke-width=".9" fill="none"><path d="M4 5h2M4 8h2M4 11h2M4 14h2M4 17h2M4 20h2"/></g><path d="M9 11.3a3.8 3.8 0 0 1 7.6 0z" fill="#d9d9d9" stroke="#222" stroke-width=".9"/><path d="M8.2 11.6h9.2" stroke="#222" stroke-width="1"/><circle cx="12.8" cy="6.9" r=".8" fill="#222"/><text x="12.8" y="16.6" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="3.6" fill="#222">MENU</text><path d="M9.5 18.3h6.6" stroke="#222" stroke-width=".8"/></symbol>
