  <!-- 왼쪽 정렬 (긴 선 둘 + 짧은 선) -->
  <symbol id="align" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M3.5 6h17M3.5 12h14M3.5 18h7"/></g></symbol>
