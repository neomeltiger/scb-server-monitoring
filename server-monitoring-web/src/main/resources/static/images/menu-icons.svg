  <symbol id="homef" viewBox="0 0 24 24"><path d="M3.6 10.3 12 3.5l8.4 6.8V19a2 2 0 0 1-2 2H14v-5.2a2 2 0 0 0-4 0V21H5.6a2 2 0 0 1-2-2z" fill="currentColor"/></symbol>
