  <symbol id="cart" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.3 11h10.3l2.2-7.5H6.4"/></g><g fill="currentColor"><circle cx="9" cy="19" r="1.5"/><circle cx="16.5" cy="19" r="1.5"/></g></symbol>
