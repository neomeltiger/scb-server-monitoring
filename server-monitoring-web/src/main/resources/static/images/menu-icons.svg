  <symbol id="mailf" viewBox="0 0 24 24"><path d="M6 4.5h12a3 3 0 0 1 3 3v.6l-9 6-9-6v-.6a3 3 0 0 1 3-3z M3 10.4l9 6 9-6v6.1a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z" fill="currentColor"/></symbol>
