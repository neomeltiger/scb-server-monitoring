<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!-- ===== TOP : 상단 헤더 (로고 + 로그인 사용자 / 로그아웃) ===== -->
<!-- 사용: <div th:replace="fragments/top :: top"></div>
     사용자명/권한은 DB tb_user (로그인 사용자 = auth.domain.AppUser).
     data-role 은 화면 스크립트가 ADMIN 전용 버튼(변경/제어)을 숨길 때 사용 (실제 권한 검사는 서버에서 함) -->
<header class="app-header" th:fragment="top">
    <button type="button" class="nav-toggle" id="navToggle" aria-controls="sidebarMenu" aria-expanded="false" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
    </button>
    <img th:src="@{/images/logo.png}" alt="SC제일은행 (Standard Chartered)" class="app-logo" width="144" height="56">
    <div class="user-bar" id="userBar" th:attr="data-role=${#authentication.principal.roleCd}">
        <!-- 전체 화면 색 : 모든 화면(좌측 메뉴·배경·주요 버튼)에 적용, 브라우저에 저장 (localStorage scbPageTheme) -->
        <label class="pt-field" title="전체 화면 색"><span class="pt-k">🎨 화면 색</span>
            <select id="pageTheme" class="pt-select" aria-label="전체 화면 색">
                <option value="">기본 (블루)</option>
                <option value="scb">SC 블루 · 그린</option>
                <option value="navy">네이비</option>
                <option value="teal">틸 (청록)</option>
                <option value="forest">포레스트 그린</option>
                <option value="purple">퍼플</option>
                <option value="sunset">선셋 오렌지</option>
                <option value="mono">모노 그레이</option>
                <option value="dark">다크 (전체 어둡게)</option>
            </select>
        </label>
        <script>
            (function () {
                var sel = document.getElementById('pageTheme');
                var cur = '';
                try { cur = localStorage.getItem('scbPageTheme') || ''; } catch (e) { cur = ''; }
                function apply(v) {
                    if (v) document.documentElement.setAttribute('data-pt', v);
                    else document.documentElement.removeAttribute('data-pt');
                }
                if (!Array.prototype.some.call(sel.options, function (o) { return o.value === cur; })) cur = '';
                sel.value = cur;
                apply(cur);
                sel.addEventListener('change', function () {
                    apply(sel.value);
                    try { localStorage.setItem('scbPageTheme', sel.value); } catch (e) { /* 저장 못 해도 이번 화면에는 적용 */ }
                });
            })();
        </script>
        <!-- 화면별 매뉴얼 : 지금 화면(menu)에 맞는 사용자 매뉴얼 절을 오른쪽 창에 표시 (manual/index.html?section=…) -->
        <button type="button" class="help-btn" id="pageHelpBtn" th:attr="data-menu=${menu},data-manual=@{/manual/index.html}"
                aria-controls="pageHelpPanel" aria-expanded="false" title="이 화면의 사용 방법 (F1)">📖 <span class="help-label">이 화면 매뉴얼</span></button>
        <span class="user-name"><b sec:authentication="principal.userNm">관리자</b>
            (<span sec:authentication="name">admin</span>) 님 · <span sec:authentication="principal.roleLabel">관리자</span></span>
        <span class="user-time" th:if="${session.loginTime != null}" th:text="'접속 ' + ${session.loginTime}"></span>
        <a class="btn-logout btn-pw" th:href="@{/password}">비밀번호 변경</a>
        <form class="logout-form" th:action="@{/logout}" method="post" data-confirm="로그아웃 하시겠습니까?" data-confirm-type="info">
            <button type="submit" class="btn-logout">로그아웃</button>
        </form>
    </div>
    <!-- 관리자 : 지금 DB 에 스키마 · 테이블이 없으면 알림 → [확인] 하면 DB 초기 구성 화면으로 (브라우저 세션당 한 번) -->
    <span id="dbHealthCheck" hidden th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
          th:attr="data-api=@{/api/admin/db-setup/health},data-page=@{/admin/db-setup},data-menu=${menu}"></span>
    <script th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
        (function () {
            var el = document.getElementById('dbHealthCheck');
            if (!el || el.getAttribute('data-menu') === 'dbsetup') return;   // 구성 화면에서는 그 화면이 직접 보여 줌
            var KEY = 'scbDbHealthAsked';
            try { if (sessionStorage.getItem(KEY)) return; } catch (e) { /* 저장 못 해도 점검 */ }
            window.addEventListener('DOMContentLoaded', function () {
                fetch(el.getAttribute('data-api'), { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
                    .then(function (r) { return r.ok ? r.json() : null; })
                    .then(function (h) {
                        if (!h || (h.connected && h.verdict === 'OK')) return;
                        try { sessionStorage.setItem(KEY, '1'); } catch (e) { /* 무시 */ }
                        var msg = !h.connected
                            ? '현재 DB 에 연결할 수 없습니다.\nDB 초기 구성 화면에서 DB 를 확인 · 생성하시겠습니까?'
                            : (!h.schemaExists ? '현재 DB 에 스키마가 없습니다.'
                                : '현재 DB(' + (h.label || '') + ' · ' + (h.schema || '') + ')에 테이블 ' + h.missingCount + '개가 없습니다'
                                  + (h.missingCount <= 6 ? ' (' + (h.missing || []).join(', ') + ')' : '') + '.')
                              + '\n\n[확인] 을 누르면 스키마 · 테이블을 만드는 DB 초기 구성 화면으로 이동합니다.';
                        var go = function (ok) { if (ok) location.href = el.getAttribute('data-page') + '?check=1'; };
                        if (typeof scbConfirm === 'function') scbConfirm(msg, { type: 'warning' }).then(go);
                        else go(window.confirm(msg));
                    })
                    .catch(function () { /* 점검 실패는 화면 사용에 영향 없음 */ });
            });
        })();
    </script>
    <div class="help-backdrop" id="pageHelpBackdrop"></div>
    <aside class="help-panel" id="pageHelpPanel" aria-label="이 화면 매뉴얼" aria-hidden="true">
        <div class="help-head">
            <div><b>📖 이 화면 매뉴얼</b><small id="pageHelpName"></small></div>
            <div class="help-head-tools">
                <a id="pageHelpFull" target="_blank" rel="noopener">전체 매뉴얼 ↗</a>
                <button type="button" id="pageHelpClose">닫기</button>
            </div>
        </div>
        <iframe class="help-frame" id="pageHelpFrame" title="이 화면 매뉴얼"></iframe>
    </aside>
    <script>
        // 화면(menu 값) → 매뉴얼 절 (static/manual/index.html 의 section id, 여러 개면 쉼표)
        (function () {
            var MAP = {
                main: ['main,mndash,pagehelp,pagetheme,alarm,agentreg', '메인 홈'], network: ['network,agent', '네트워크 구성도'], servers: ['servers', '서버 전체 목록'],
                logs: ['serverlog', '서버 로그'], heartbeat: ['heartbeat', '하트비트 모니터링'], fallback: ['fallback', '데몬 중단 프로세스 현황'],
                agents: ['agentmgr,srvreset', '에이전트 관리'], processes: ['process', '프로세스 관리'], users: ['users', '사용자 관리'],
                menuauth: ['menuauth', '권한관리 · 메뉴 권한'], menuedit: ['menuauth', '권한관리 · 메뉴 이름·순서'], apiguide: ['apiguide,swagger', 'API 가이드'],
                dbconn: ['dbconf', 'DB 연결 관리'], srvreport: ['srvreport', '서버 점검 리포트'], settings: ['settings', '환경 설정'], dbsetup: ['dbsetup,dbconf', 'DB 초기 구성']
            };
            var btn = document.getElementById('pageHelpBtn');
            var panel = document.getElementById('pageHelpPanel');
            if (!btn || !panel) return;
            var frame = document.getElementById('pageHelpFrame');
            var back = document.getElementById('pageHelpBackdrop');
            var base = btn.getAttribute('data-manual');
            var m = MAP[btn.getAttribute('data-menu')] || ['overview,roles', '시스템 개요'];
            var first = m[0].split(',')[0];
            document.getElementById('pageHelpName').textContent = m[1];
            document.getElementById('pageHelpFull').href = base + '#' + first;
            function set(open) {
                if (open && !frame.getAttribute('src')) frame.setAttribute('src', base + '?section=' + encodeURIComponent(m[0]));
                panel.classList.toggle('open', open);
                back.classList.toggle('open', open);
                panel.setAttribute('aria-hidden', String(!open));
                btn.setAttribute('aria-expanded', String(open));
                if (open) document.getElementById('pageHelpClose').focus(); else btn.focus();
            }
            btn.addEventListener('click', function () { set(!panel.classList.contains('open')); });
            document.getElementById('pageHelpClose').addEventListener('click', function () { set(false); });
            back.addEventListener('click', function () { set(false); });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'F1') { e.preventDefault(); set(!panel.classList.contains('open')); }
                else if (e.key === 'Escape' && panel.classList.contains('open')) set(false);
            });
        })();
    </script>
    <!-- 좁은 화면(1024px 이하) : 좌측 메뉴를 왼쪽에서 밀어 여는 메뉴로 사용 -->
    <script>
        (function () {
            var btn = document.getElementById('navToggle');
            var menu = document.getElementById('sidebarMenu');
            if (!btn || !menu) return;
            var backdrop = document.createElement('div');
            backdrop.className = 'nav-backdrop';
            document.body.appendChild(backdrop);
            function set(open) {
                document.body.classList.toggle('nav-open', open);
                btn.setAttribute('aria-expanded', String(open));
                btn.setAttribute('aria-label', open ? '메뉴 닫기' : '메뉴 열기');
            }
            btn.addEventListener('click', function () { set(!document.body.classList.contains('nav-open')); });
            backdrop.addEventListener('click', function () { set(false); });
            menu.addEventListener('click', function (e) { if (e.target.closest('a')) set(false); });
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape') set(false); });
            window.addEventListener('resize', function () { if (window.innerWidth > 1024) set(false); });
        })();
    </script>
</header>
</body>
</html>
