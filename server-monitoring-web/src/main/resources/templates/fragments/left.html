<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!-- ===== LEFT : 좌측 트리 메뉴 ===== -->
<!-- 사용: <div th:replace="fragments/left :: left(${menu})"></div>  (menu: main | network | servers | logs | agents | processes | users)
     시스템관리 > 사용자 관리 는 ADMIN 에게만 보임 (pendingUserCount : web.LayoutModelAdvice) -->
<div class="sidebar-menu" id="sidebarMenu" th:fragment="left(menu)">
    <div class="sidebar-header">
        <h3>통합 서버 모니터링</h3>
        <p>Murex Group System</p>
    </div>
    <ul class="tree-menu">
        <li class="tree-item">
            <a th:href="@{/}" class="tree-link" th:classappend="${menu == 'main'} ? 'active'">
                <span class="icon">🏠</span> 메인 홈
            </a>
        </li>
        <li class="tree-item has-submenu">
            <div class="tree-category"><span class="icon">💻</span> 서버자원모니터링</div>
            <ul class="submenu">
                <li><a th:href="@{/network}" class="tree-link" th:classappend="${menu == 'network'} ? 'active'"><span class="bullet">▪</span> 네트워크구성도</a></li>
                <li><a th:href="@{/servers}" class="tree-link" th:classappend="${menu == 'servers'} ? 'active'"><span class="bullet">▪</span> 서버전체목록</a></li>
                <li><a th:href="@{/logs}" class="tree-link" th:classappend="${menu == 'logs'} ? 'active'"><span class="bullet">▪</span> 서버 로그</a></li>
                <li><a th:href="@{/agents}" class="tree-link" th:classappend="${menu == 'agents'} ? 'active'"><span class="bullet">▪</span> 에이전트 관리</a></li>
            </ul>
        </li>
        <li class="tree-item has-submenu">
            <div class="tree-category"><span class="icon">⚙️</span> 프로세스운영</div>
            <ul class="submenu">
                <li><a th:href="@{/processes}" class="tree-link" th:classappend="${menu == 'processes'} ? 'active'"><span class="bullet">▪</span> 프로세스관리(CRUD)</a></li>
            </ul>
        </li>
        <li class="tree-item has-submenu" sec:authorize="hasRole('ADMIN')">
            <div class="tree-category"><span class="icon">👤</span> 시스템관리</div>
            <ul class="submenu">
                <li><a th:href="@{/admin/users}" class="tree-link" th:classappend="${menu == 'users'} ? 'active'"><span class="bullet">▪</span> 사용자 관리(가입 승인)
                    <span class="nav-count" id="navPendingCount" th:text="${pendingUserCount}" th:hidden="${pendingUserCount == null or pendingUserCount == 0}">0</span></a></li>
                <li><a th:href="@{/swagger-ui.html}" class="tree-link" target="_blank" rel="noopener"><span class="bullet">▪</span> API 문서(Swagger)</a></li>
            </ul>
        </li>
        <li class="tree-item">
            <a th:href="@{/manual/index.html}" class="tree-link" target="_blank" rel="noopener">
                <span class="icon">📖</span> 사용자 매뉴얼
            </a>
        </li>
    </ul>
</div>
</body>
</html>
