<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 변경 - 통합 서버 관리 및 모니터링 시스템</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page-body">
    <main class="login-page">
        <!--
            비밀번호 변경 (auth.controller.PasswordController, POST /password)
            현재 비밀번호가 틀리면 로그인 실패와 같이 실패 횟수 증가 (연속 5회 → 잠금)
            변경 후 로그아웃되고 새 비밀번호로 다시 로그인
        -->
        <form class="login-page-card" id="pwForm" th:action="@{/password}" th:object="${form}" method="post" novalidate>
            <img th:src="@{/images/logo.png}" alt="SC제일은행 (Standard Chartered)" class="login-page-logo" width="144" height="56">
            <div class="login-page-title">
                <h1>비밀번호 변경</h1>
                <p>현재 비밀번호를 확인한 후 새 비밀번호로 변경합니다.</p>
            </div>

            <div class="login-info" role="status" style="display:block;" data-status="warning" th:if="${param.temp != null}">
                관리자가 만든 <b>임시 비밀번호</b>로 로그인했습니다. 현재 비밀번호 칸에 임시 비밀번호를 넣고 새 비밀번호로 바꾸세요.
                바꾸기 전에는 다른 화면을 쓸 수 없으며, 바꾸면 새 비밀번호로 다시 로그인합니다.
            </div>
            <div class="login-error" role="alert" style="display:block;" data-status="error" th:if="${#fields.hasGlobalErrors()}"
                 th:text="${#fields.globalErrors()[0]}"></div>

            <div class="login-form-group" th:classappend="${#fields.hasErrors('userId')} ? 'has-error'">
                <label for="userId">계정 (ID)</label>
                <input type="text" id="userId" th:field="*{userId}" maxlength="30" autocomplete="username"
                       th:readonly="${loggedIn}" th:autofocus="${!loggedIn}" required>
                <div class="field-error" th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}"></div>
            </div>
            <div class="login-form-group" th:classappend="${#fields.hasErrors('currentPassword')} ? 'has-error'">
                <label for="currentPassword" th:text="${param.temp != null} ? '현재 비밀번호 (임시 비밀번호)' : '현재 비밀번호'">현재 비밀번호</label>
                <input type="password" id="currentPassword" th:field="*{currentPassword}" maxlength="100"
                       autocomplete="current-password" th:autofocus="${loggedIn}" required>
                <div class="login-caps" id="capsWarn" role="status" hidden>Caps Lock 이 켜져 있습니다.</div>
                <div class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
            </div>
            <div class="login-form-group" th:classappend="${#fields.hasErrors('newPassword')} ? 'has-error'">
                <label for="newPassword">새 비밀번호 <span class="hint">8자 이상, 영문·숫자·특수문자, 아이디 포함 불가</span></label>
                <input type="password" id="newPassword" th:field="*{newPassword}" maxlength="100" autocomplete="new-password" required>
                <div class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
            </div>
            <div class="login-form-group" th:classappend="${#fields.hasErrors('newPasswordConfirm')} ? 'has-error'">
                <label for="newPasswordConfirm">새 비밀번호 확인</label>
                <input type="password" id="newPasswordConfirm" th:field="*{newPasswordConfirm}" maxlength="100" autocomplete="new-password" required>
                <div class="field-error" th:if="${#fields.hasErrors('newPasswordConfirm')}" th:errors="*{newPasswordConfirm}"></div>
            </div>

            <div class="btn-row">
                <a class="btn-cancel-link" th:href="${loggedIn} ? @{/} : @{/login}" th:text="${loggedIn} ? '취소 (메인으로)' : '취소 (로그인으로)'">취소</a>
                <button type="submit" class="btn-login" id="pwBtn">비밀번호 변경</button>
            </div>
            <div class="login-links" th:if="${loggedIn}">변경하면 로그아웃되며, 새 비밀번호로 다시 로그인합니다.</div>
        </form>
    </main>
    <script>
        (function () {
            var warn = document.getElementById('capsWarn');
            function caps(e) { if (e.getModifierState) warn.hidden = !e.getModifierState('CapsLock'); }
            ['currentPassword', 'newPassword', 'newPasswordConfirm'].forEach(function (id) {
                var el = document.getElementById(id);
                el.addEventListener('keydown', caps);
                el.addEventListener('keyup', caps);
            });
            document.getElementById('pwForm').addEventListener('submit', function () {
                var b = document.getElementById('pwBtn');
                b.disabled = true;
                b.textContent = '변경 중...';
            });
        })();
    </script>
</body>
</html>
