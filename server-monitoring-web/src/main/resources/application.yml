server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      timeout: 30m

spring:
  application:
    name: server-monitoring-web
  thymeleaf:
    cache: true

  # 주 DB : MySQL 8.x (스키마 scb_mon_agent) - 네트워크 구성도 서버/프로세스
  #   테이블 생성: db\init-mysql.bat (src/main/resources/db/schema-mysql.sql, data.sql)
  #   접속 정보는 환경변수로 바꿀 수 있습니다: MYSQL_HOST, MYSQL_PORT, MYSQL_USER, MYSQL_PASSWORD
  #   ※ 비밀번호는 저장소에 두지 않습니다. 실행 전 MYSQL_PASSWORD 환경변수로 지정하세요.
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/scb_mon_agent?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      pool-name: mysql-pool
      maximum-pool-size: 10
      connection-timeout: 5000

# MyBatis : Mapper XML = resources/mapper/**/*.xml (ANSI SQL)
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.scb.monitoring.topology.domain
  configuration:
    map-underscore-to-camel-case: true      # server_id → serverId
    jdbc-type-for-null: 'NULL'
    default-statement-timeout: 30

app:
  # API 문서 : Swagger UI(/swagger-ui.html) · OpenAPI(/v3/api-docs) · API 가이드(/admin/api-guide) · 예제 소스(/samples/**)
  #            · Postman 컬렉션(/api/docs/**) · 화면 데이터(/api/admin/docs/**)
  # 운영에서 제외 : 프로파일 prod (--spring.profiles.active=default,prod) 또는 환경변수 API_DOCS_ENABLED=false
  #   → 위 주소는 모두 404, 좌측 메뉴에서도 숨김 (config.ApiDocsBlockFilter). 이전 이름 SWAGGER_ENABLED 도 인식
  api-docs:
    enabled: ${API_DOCS_ENABLED:${SWAGGER_ENABLED:true}}
  # 로그인 : 사용자는 DB tb_user (비밀번호 BCrypt), 로그인 이력 tb_login_hist
  # ※ 초기 계정 admin / admin (db/users.sql) 은 데모용입니다. 운영 시 반드시 변경하세요.
  security:
    max-login-failures: 5                       # 연속 실패 시 계정 잠금 (tb_user.lock_yn = 'Y')

  # 서버 에이전트 (krcasmrx11_client) 연동 : /agent-api/v1 (토큰 인증)
  agent:
    report-interval-sec: 60                     # 에이전트 보고 주기 (에이전트 설정으로 전달)
    history-keep-days: 7                        # 수집 이력 보관 일수
    command-request-timeout-min: 10             # 에이전트가 가져가지 않은 제어 명령 만료
    command-result-timeout-min: 30              # 결과가 오지 않은 제어 명령 만료
    stale-after-sec: 300                        # 이 시간 이상 보고가 없으면 "보고 끊김" 표시
    heartbeat-check-ms: 2000                    # 하트비트 감시 주기 - 3회 연속 미수신(주기 x 3 + 2초)이면 서버 다운 → 프로세스 즉시 종료 표시
    # 서버(에이전트)가 접속할 웹 주소 = client.env 의 SCB_WEB_URL (토큰 발급 화면에 표시)
    #   서버에서 localhost 는 서버 자신이므로, 서버가 접속 가능한 이 웹 서버의 IP/호스트명을 지정하세요.
    #   비우면 화면을 연 주소를 사용 (localhost 로 열었으면 이 PC 의 네트워크 IP 로 바꿔 표시)
    public-url: ${SCB_PUBLIC_URL:}

  # 서버 장애 알람 (tb_alarm) : 서버 Down → CRITICAL, 에이전트 보고 끊김 → WARNING
  alarm:
    check-interval-ms: 60000                    # 점검 주기 (서버 수정/에이전트 보고 직후에도 점검)
    initial-delay-ms: 10000                     # 기동 후 첫 점검
    closed-keep-hours: 24                       # 메인 홈 "최근 해소 알람" 표시 시간

  # 웹 콘솔 (SSH 원격 접속)
  console:
    mode: live                                  # live: 실제 SSH 접속 / demo: 브라우저 시뮬레이션
    allowed-hosts-file: config/allowed-hosts.json # 접속 허용 서버 목록 (실행 위치 기준 경로)
    allowed-origins: []                         # 비우면 이 서버와 같은 주소에서 연 화면만 허용
    ssh:
      connect-timeout-ms: 15000
      keep-alive-ms: 30000
      max-password-tries: 3
      strict-host-key-checking: "no"            # yes: known-hosts-file 에 등록된 서버만 접속 (운영 권장)
      known-hosts-file: ""
      legacy-algorithms: true                   # 구형 SSH(Solaris 10 Sun_SSH 등) 호환: SHA-1 키교환, ssh-rsa, CBC, hmac-sha1 허용
      term-type: xterm                          # TERM 값 (Solaris 10 은 xterm-256color 미지원)

# Swagger UI : /swagger-ui.html (ADMIN 로그인 필요) - 끄려면 SWAGGER_ENABLED=false
springdoc:
  api-docs:
    enabled: ${app.api-docs.enabled}
  swagger-ui:
    enabled: ${app.api-docs.enabled}
    path: /swagger-ui.html
    csrf:
      enabled: true                             # XSRF-TOKEN 쿠키 → X-XSRF-TOKEN 헤더 (변경 요청)
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: false                   # [Try it out] 을 눌러야 호출
  default-produces-media-type: application/json
  writer-with-order-by-keys: true

logging:
  # 콘솔·파일 로그 UTF-8 (Windows 는 chcp 65001, Solaris 는 UTF-8 터미널에서 한글 정상 - EUC-KR 터미널은 bin/scb_web.sh log 가 변환)
  charset:
    console: UTF-8
    file: UTF-8
  level:
    console-audit: INFO

---
# 데모 모드: java -jar ... --spring.profiles.active=demo  /  mvn spring-boot:run -Dspring-boot.run.profiles=demo
spring:
  config:
    activate:
      on-profile: demo
  thymeleaf:
    cache: false
app:
  console:
    mode: demo

---
# Sybase ASE 연결 (보조 DB): --spring.profiles.active=sybase  (데모와 함께: sybase,demo)
# 접속 정보는 환경변수로 지정합니다. (C:\scb\env.bat 참고 / 비밀번호는 파일에 쓰지 마세요)
#   SYBASE_HOST, SYBASE_PORT, SYBASE_DB, SYBASE_USER, SYBASE_PASSWORD, SYBASE_CHARSET
# 연결 확인: 로그인 후 /api/db/status
spring:
  config:
    activate:
      on-profile: sybase
app:
  sybase:
    datasource:
      driver-class-name: net.sourceforge.jtds.jdbc.Driver
      url: jdbc:jtds:sybase://${SYBASE_HOST:127.0.0.1}:${SYBASE_PORT:5000}/${SYBASE_DB:scbmon};charset=${SYBASE_CHARSET:utf8};appName=server-monitoring-web
      username: ${SYBASE_USER:scbmon}
      password: ${SYBASE_PASSWORD:}
      hikari:
        pool-name: sybase-pool
        maximum-pool-size: 5
        minimum-idle: 1
        connection-timeout: 5000
        connection-test-query: select 1        # jTDS 는 JDBC4 isValid() 미지원 → 검사 쿼리 필수
        initialization-fail-timeout: -1        # DB 가 꺼져 있어도 애플리케이션은 시작

---
# 운영 : --spring.profiles.active=default,prod  (Sybase 와 함께 : sybase,prod)
#   Swagger UI · API 문서 · API 가이드 · 예제 소스를 제외 (환경변수로 켤 수 없음)
spring:
  config:
    activate:
      on-profile: prod
  thymeleaf:
    cache: true
app:
  api-docs:
    enabled: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
