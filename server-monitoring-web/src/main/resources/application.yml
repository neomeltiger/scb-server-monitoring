server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      timeout: 30m

spring:
  application:
    name: server-monitoring-web
  thymeleaf:
    cache: true

  # 주 DB 는 app.db (config.db.DbConfig) 가 만듭니다 - spring.datasource 는 쓰지 않음

# MyBatis : Mapper XML = resources/mapper/**/*.xml (ANSI SQL)
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.scb.monitoring.topology.domain
  configuration:
    map-underscore-to-camel-case: true      # server_id → serverId
    jdbc-type-for-null: 'NULL'
    default-statement-timeout: 30

app:
  # ---------------------------------------------------------------- DB (config.db.DbConfig)
  # 주 DB : 우선순위 Oracle → Sybase → MySQL → MariaDB → H2 (켜진 DB 중 연결되는 첫 DB), 연결이 끊기면 다음 순위로 자동 교체
  #   설정 파일 conf/scb-db.properties (SCB_DB_CONFIG 로 위치 지정, 템플릿 db/scb-db.properties.template) - 관리자 화면 /admin/db 에서 저장
  #   파일이 없거나 값이 비면 아래 값 : SCB_DB = auto / oracle / sybase / mysql / mariadb / h2, Oracle·Sybase 는 SCB_ORACLE_URL · SYBASE_HOST 가 있을 때만
  # 개별 연결 : MysqlJdbc / MariaDbJdbc / H2Jdbc / SybaseJdbc(sybase 프로필) / OracleJdbc(oracle 프로필), 상태 GET /api/db/status
  # 데이터 이전 : --app.db.migrate=mysql:mariadb (또는 mysql:h2) - 실행 패키지 bin\scb_web.bat migrate-db mysql:mariadb
  db:
    primary: ${SCB_DB:auto}
    config-file: ${SCB_DB_CONFIG:}
    probe-timeout-ms: ${SCB_DB_PROBE_MS:3000}
    # MySQL 8.x (스키마 scb_mon_agent) - 테이블 생성 db\init-mysql.bat
    #   ※ 비밀번호는 저장소에 두지 않습니다. 실행 전 MYSQL_PASSWORD 환경변수로 지정하세요.
    mysql:
      url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/scb_mon_agent?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      username: ${MYSQL_USER:root}
      password: ${MYSQL_PASSWORD:}
      maximum-pool-size: 10
      connection-timeout: 5000
    # MariaDB : 임베디드(기본)면 아래 embedded 설정을 쓰고, 외부 MariaDB 면 SCB_MARIADB_EMBEDDED=false + SCB_MARIADB_URL
    mariadb:
      url: ${SCB_MARIADB_URL:jdbc:mariadb://127.0.0.1:13307/scb_mon_agent}
      username: ${SCB_MARIADB_USER:root}
      password: ${SCB_MARIADB_PASSWORD:}      # 임베디드 : 비우면 처음 만들 때 무작위 비밀번호 → {data}.scb-embedded.properties
      maximum-pool-size: 10
      connection-timeout: 5000
    # MariaDB 임베디드 : 웹이 mariadb/<플랫폼>/bin/mariadbd 를 시작·종료 (127.0.0.1:13307 전용)
    #   Windows : 실행 패키지 mariadb/windows-x64 (MariaDB 10.11 LTS), Solaris 10 SPARC : MariaDB 배포본 없음 → H2 사용
    embedded:
      enabled: ${SCB_MARIADB_EMBEDDED:true}
      home: ${SCB_MARIADB_HOME:}              # 비우면 실행 폴더의 mariadb/<플랫폼>
      data: ${SCB_MARIADB_DATA:}              # 비우면 실행 폴더의 data/mariadb
      port: ${SCB_MARIADB_PORT:13307}
      start-timeout-sec: 60
    # H2 파일 DB : 자바만으로 동작 (Windows · Solaris 10 SPARC), 파일 {dir}/scb_mon_agent.mv.db
    h2:
      enabled: ${SCB_H2_ENABLED:true}
      dir: ${SCB_H2_DATA:}                    # 비우면 실행 폴더의 data/h2

  # API 문서 : Swagger UI(/swagger-ui.html) · OpenAPI(/v3/api-docs) · API 가이드(/admin/api-guide) · 예제 소스(/samples/**)
  #            · Postman 컬렉션(/api/docs/**) · 화면 데이터(/api/admin/docs/**)
  # 운영에서 제외 : 프로파일 prod (--spring.profiles.active=default,prod) 또는 환경변수 API_DOCS_ENABLED=false
  #   → 위 주소는 모두 404, 좌측 메뉴에서도 숨김 (config.ApiDocsBlockFilter). 이전 이름 SWAGGER_ENABLED 도 인식
  api-docs:
    enabled: ${API_DOCS_ENABLED:${SWAGGER_ENABLED:true}}
  # 로그인 : 사용자는 DB tb_user (비밀번호 BCrypt), 로그인 이력 tb_login_hist
  # ※ 초기 계정 admin / admin (db/users.sql) 은 데모용입니다. 운영 시 반드시 변경하세요.
  security:
    max-login-failures: 5                       # 연속 실패 시 계정 잠금 (tb_user.lock_yn = 'Y')

  # 서버 에이전트 (svr_collect_client) 연동 : /agent-api/v1 (토큰 인증)
  agent:
    report-interval-sec: 60                     # 에이전트 보고 주기 (에이전트 설정으로 전달)
    history-keep-days: 7                        # 수집 이력 보관 일수
    command-request-timeout-min: 10             # 에이전트가 가져가지 않은 제어 명령 만료
    command-result-timeout-min: 30              # 결과가 오지 않은 제어 명령 만료
    stale-after-sec: 300                        # 이 시간 이상 보고가 없으면 "보고 끊김" 표시
    heartbeat-check-ms: 2000                    # 하트비트 감시 주기 - 3회 연속 미수신(주기 x 3 + 2초)이면 서버 다운 → 프로세스 즉시 종료 표시
    # 서버(에이전트)가 접속할 웹 주소 = client.env 의 SCB_WEB_URL (토큰 발급 화면에 표시)
    #   서버에서 localhost 는 서버 자신이므로, 서버가 접속 가능한 이 웹 서버의 IP/호스트명을 지정하세요.
    #   비우면 화면을 연 주소를 사용 (localhost 로 열었으면 이 PC 의 네트워크 IP 로 바꿔 표시)
    public-url: ${SCB_PUBLIC_URL:}
    # 서버 부하 시 수집 주기 자동 연장 : CPU 또는 메모리가 load-throttle-pct(%) 를 넘으면 수집 주기를 최소 load-throttle-min-sec(초)로
    #   (사용자 설정이 더 길면 그대로, 부하가 내려가면 사용자 설정으로 돌아감 - 데몬이 10초마다 받는 ctl|interval 로 적용)
    load-throttle-pct: ${SCB_LOAD_THROTTLE_PCT:90}
    load-throttle-min-sec: ${SCB_LOAD_THROTTLE_MIN_SEC:60}

  # 로그 · 이력 보관 기간 (tb_retention, 환경 설정 화면) : 보관 기간이 지난 행을 이 주기로 삭제 - DB 용량 초과 방지
  retention:
    purge-interval-ms: 3600000                  # 자동 삭제 주기 (1시간)
    initial-delay-ms: 120000                    # 웹 시작 후 첫 삭제 (2분)

  # 서버 장애 알람 (tb_alarm) : 서버 Down → CRITICAL, 에이전트 보고 끊김 → WARNING
  alarm:
    check-interval-ms: 60000                    # 점검 주기 (서버 수정/에이전트 보고 직후에도 점검)
    initial-delay-ms: 10000                     # 기동 후 첫 점검
    closed-keep-hours: 24                       # 메인 홈 "최근 해소 알람" 표시 시간

  # 웹 콘솔 (SSH 원격 접속)
  console:
    mode: live                                  # live: 실제 SSH 접속 / demo: 브라우저 시뮬레이션
    allowed-hosts-file: config/allowed-hosts.json # 접속 허용 서버 목록 (실행 위치 기준 경로)
    allowed-origins: []                         # 비우면 이 서버와 같은 주소에서 연 화면만 허용
    ssh:
      connect-timeout-ms: 15000
      keep-alive-ms: 30000
      max-password-tries: 3
      strict-host-key-checking: "no"            # yes: known-hosts-file 에 등록된 서버만 접속 (운영 권장)
      known-hosts-file: ""
      legacy-algorithms: true                   # 구형 SSH(Solaris 10 Sun_SSH 등) 호환: SHA-1 키교환, ssh-rsa, CBC, hmac-sha1 허용
      term-type: xterm                          # TERM 값 (Solaris 10 은 xterm-256color 미지원)

# Swagger UI : /swagger-ui.html (ADMIN 로그인 필요) - 끄려면 SWAGGER_ENABLED=false
springdoc:
  api-docs:
    enabled: ${app.api-docs.enabled}
  swagger-ui:
    enabled: ${app.api-docs.enabled}
    path: /swagger-ui.html
    csrf:
      enabled: true                             # XSRF-TOKEN 쿠키 → X-XSRF-TOKEN 헤더 (변경 요청)
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: false                   # [Try it out] 을 눌러야 호출
    validator-url: none                         # 외부 검증기(validator.swagger.io) 호출 안 함 - 오프라인
  default-produces-media-type: application/json
  writer-with-order-by-keys: true

logging:
  # 콘솔·파일 로그 UTF-8 (Windows 는 chcp 65001, Solaris 는 UTF-8 터미널에서 한글 정상 - EUC-KR 터미널은 bin/scb_web.sh log 가 변환)
  charset:
    console: UTF-8
    file: UTF-8
  level:
    console-audit: INFO

---
# 데모 모드: java -jar ... --spring.profiles.active=demo  /  mvn spring-boot:run -Dspring-boot.run.profiles=demo
spring:
  config:
    activate:
      on-profile: demo
  thymeleaf:
    cache: false
app:
  console:
    mode: demo

---
# Sybase ASE 연결 (보조 DB): --spring.profiles.active=sybase  (데모와 함께: sybase,demo)
# 접속 정보는 환경변수로 지정합니다. (C:\scb\env.bat 참고 / 비밀번호는 파일에 쓰지 마세요)
#   SYBASE_HOST, SYBASE_PORT, SYBASE_DB, SYBASE_USER, SYBASE_PASSWORD, SYBASE_CHARSET
# 연결 확인: 로그인 후 /api/db/status
spring:
  config:
    activate:
      on-profile: sybase
app:
  sybase:
    datasource:
      driver-class-name: net.sourceforge.jtds.jdbc.Driver
      url: jdbc:jtds:sybase://${SYBASE_HOST:127.0.0.1}:${SYBASE_PORT:5000}/${SYBASE_DB:scbmon};charset=${SYBASE_CHARSET:utf8};appName=server-monitoring-web
      username: ${SYBASE_USER:scbmon}
      password: ${SYBASE_PASSWORD:}
      hikari:
        pool-name: sybase-pool
        maximum-pool-size: 5
        minimum-idle: 1
        connection-timeout: 5000
        connection-test-query: select 1        # jTDS 는 JDBC4 isValid() 미지원 → 검사 쿼리 필수
        initialization-fail-timeout: -1        # DB 가 꺼져 있어도 애플리케이션은 시작

---
# Oracle 보조 연결 (oracle 프로필) : --spring.profiles.active=default,oracle  (OracleJdbc, 상태 /api/db/status)
#   SCB_ORACLE_URL 예) jdbc:oracle:thin:@//10.0.0.20:1521/ORCLPDB1 , SCB_ORACLE_USER, SCB_ORACLE_PASSWORD (비밀번호는 파일에 쓰지 마세요)
spring:
  config:
    activate:
      on-profile: oracle
app:
  oracle:
    datasource:
      url: ${SCB_ORACLE_URL:jdbc:oracle:thin:@//127.0.0.1:1521/ORCLPDB1}
      username: ${SCB_ORACLE_USER:scbmon}
      password: ${SCB_ORACLE_PASSWORD:}
      maximum-pool-size: 5
      connection-timeout: 5000

---
# 운영 : --spring.profiles.active=default,prod  (Sybase 와 함께 : sybase,prod)
#   Swagger UI · API 문서 · API 가이드 · 예제 소스를 제외 (환경변수로 켤 수 없음)
spring:
  config:
    activate:
      on-profile: prod
  thymeleaf:
    cache: true
app:
  api-docs:
    enabled: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
